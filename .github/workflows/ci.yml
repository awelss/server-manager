name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          find app routes database/migrations -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Agent shell syntax check
        run: |
          bash -n public/agent/agent.sh
          bash -n public/agent/install.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Run Laravel tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
